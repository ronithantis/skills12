<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מראת ההתארגנות - מערכת אבחון אישית</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
      .print-area { box-shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-slate-200 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ============================================================
    //  מגדר: מנוע התאמת גוף
    //  m = צורת זכר, f = צורת נקבה. הפונקציה g בוחרת לפי המגדר הפעיל.
    // ============================================================
    // שימוש: g('אתה','את')  →  מחזיר לפי המגדר שנבחר.

    // ============================================================
    //  4 תחומי ההתארגנות
    // ============================================================
    const DOMAINS = {
      COGNITIVE: 'התארגנות מחשבתית',
      ENVIRONMENT: 'התארגנות בסביבה',
      DIGITAL: 'התארגנות דיגיטלית',
      TIME: 'התארגנות בזמן ובמשימות',
    };

    const DOMAIN_DESCRIPTIONS = {
      [DOMAINS.COGNITIVE]: 'יכולת לתכנן קדימה, לקבוע סדר עדיפויות, לפרק משימות גדולות ולעבוד עם רשימות.',
      [DOMAINS.ENVIRONMENT]: 'שמירה על סדר בציוד, בתיק, בשולחן העבודה ומקום קבוע לחפצים אישיים.',
      [DOMAINS.DIGITAL]: 'ניהול תיקיות וקבצים במחשב ובטלפון, שמות מסמכים ברורים וגיבוי חומרים.',
      [DOMAINS.TIME]: 'ניהול שגרות יומיות, הכנה מראש, עמידה בזמנים והתמודדות עם דחיינות ועומס.',
    };

    // ============================================================
    //  24 מצבי אבחון (6 לכל תחום) — טקסט מגדרי כפונקציה של g
    // ============================================================
    const buildQuestions = (g) => ([
      // Cognitive
      {
        id: 'c1', domain: DOMAINS.COGNITIVE,
        scenario: `כש${g('יש לך','יש לך')} שבוע עמוס במבחנים ועבודות, כיצד ${g('אתה ניגש','את ניגשת')} אל המשימות?`,
        options: [
          { text: `${g('מכין','מכינה')} רשימת משימות מסודרת ו${g('מחלק','מחלקת')} את החומר לימים ספציפיים מראש.`, score: 4 },
          { text: `${g('רושם','רושמת')} לעצמי נקודות מרכזיות ו${g('מתחיל','מתחילה')} לעבוד לפי מה שדחוף יותר.`, score: 3 },
          { text: `${g('מנסה','מנסה')} לזכור בראש מה צריך לעשות ו${g('עובד','עובדת')} כשיש זמן.`, score: 2 },
          { text: `${g('מתחיל','מתחילה')} ללמוד רק ברגע שהעומס מרגיש ממש מעיק.`, score: 1 },
        ]
      },
      {
        id: 'c2', domain: DOMAINS.COGNITIVE,
        scenario: `כש${g('אתה מקבל','את מקבלת')} פרויקט לימודי גדול או עבודה ארוכה לקראת הגשה:`,
        options: [
          { text: `${g('מפרק','מפרקת')} מיד את המשימה לשלבים קטנים ו${g('קובע','קובעת')} תאריך יעד לכל שלב.`, score: 4 },
          { text: `${g('חושב','חושבת')} על השלבים העיקריים ו${g('מתחיל','מתחילה')} בחלק הראשון בימים הקרובים.`, score: 3 },
          { text: `${g('מחכה','מחכה')} קצת, ורק כשהמועד מתקרב ${g('מנסה','מנסה')} להבין מאיפה להתחיל.`, score: 2 },
          { text: `${g('עובד','עובדת')} בבת אחת על כל הפרויקט ביומיים האחרונים לפני ההגשה.`, score: 1 },
        ]
      },
      {
        id: 'c3', domain: DOMAINS.COGNITIVE,
        scenario: `כש${g('אתה מרגיש','את מרגישה')} הצפה מרוב משימות ולימודים:`,
        options: [
          { text: `${g('עוצר','עוצרת')}, ${g('מרוקן','מרוקנת')} את כל המחשבות לדף ו${g('בוחר','בוחרת')} משימה אחת ראשונה להתמקד בה.`, score: 4 },
          { text: `${g('לוקח','לוקחת')} הפסקה קצרה כדי להירגע ואז ${g('חוזר','חוזרת')} לעשות מה ש${g('ביכולתי','ביכולתי')}.`, score: 3 },
          { text: `${g('מדלג','מדלגת')} בין כמה דברים במקביל בלי לסיים אף אחד עד הסוף.`, score: 2 },
          { text: `${g('משתקע','משתקעת')} בחוסר מעש ו${g('נמנע','נמנעת')} מלהתחיל לעבוד עד שמישהו עוזר לי.`, score: 1 },
        ]
      },
      {
        id: 'c4', domain: DOMAINS.COGNITIVE,
        scenario: `איך ${g('אתה קובע','את קובעת')} באיזה נושא להתחיל ללמוד בשעות אחה"צ?`,
        options: [
          { text: `לפי תכנון מוקדם ש${g('קבעתי','קבעתי')} מראש בתחילת השבוע.`, score: 4 },
          { text: 'לפי מה שחשוב ודחוף יותר ליום המחרת.', score: 3 },
          { text: `לפי מה ש${g('בא לי','בא לי')} לעשות באותו רגע.`, score: 2 },
          { text: `אני בדרך כלל ${g('דוחה','דוחה')} את ההחלטה עד הערב.`, score: 1 },
        ]
      },
      {
        id: 'c5', domain: DOMAINS.COGNITIVE,
        scenario: `עד כמה ${g('אתה משתמש','את משתמשת')} ברשימות מעקב (Checklist) למשימות ולציוד?`,
        options: [
          { text: `${g('משתמש','משתמשת')} באופן קבוע ביומן, אפליקציה או מחברת ייעודית.`, score: 4 },
          { text: `${g('כותב','כותבת')} רשימות מדי פעם כשמדובר בימים עמוסים במיוחד.`, score: 3 },
          { text: `${g('רושם','רושמת')} לפעמים פתקים קטנים אבל ${g('נוטה','נוטה')} לאבד אותם.`, score: 2 },
          { text: `לא ${g('משתמש','משתמשת')} ברשימות בכלל, ${g('מעדיף','מעדיפה')} להסתמך על הזיכרון.`, score: 1 },
        ]
      },
      {
        id: 'c6', domain: DOMAINS.COGNITIVE,
        scenario: `כשמשהו בתכנון המקורי שלך משתנה פתאום (למשל: בוטל שיעור או נוסף מבחן):`,
        options: [
          { text: `${g('מתאים','מתאימה')} מחדש את התוכנית השבועית ברוגע ובמהירות.`, score: 4 },
          { text: `${g('מתארגן','מתארגנת')} מחדש תוך כמה דקות ו${g('ממשיך','ממשיכה')} הלאה.`, score: 3 },
          { text: `${g('מתעצבן','מתעצבנת')} מעט, ו${g('לוקח','לוקח')} לי זמן לחזור לפוקוס.`, score: 2 },
          { text: 'זה מוציא אותי לחלוטין מאיזון ומשבש לי את כל יתר היום.', score: 1 },
        ]
      },

      // Environment
      {
        id: 'e1', domain: DOMAINS.ENVIRONMENT,
        scenario: 'איך נראה תהליך הכנת ילקוט בית הספר שלך בערב?',
        options: [
          { text: `${g('בודק','בודקת')} מערכת שעות, ${g('מוציא','מוציאה')} ציוד מיותר ו${g('מכניס','מכניסה')} בדיוק מה שצריך למחר.`, score: 4 },
          { text: `${g('מציץ','מציצה')} במערכת ו${g('מארגן','מארגנת')} את התיק במהירות תוך שתי דקות.`, score: 3 },
          { text: `${g('מארגן','מארגנת')} בבוקר בלחץ רגע לפני היציאה מהבית.`, score: 2 },
          { text: 'התיק נשאר עמוס תמיד בכל המחברות והספרים של השבוע.', score: 1 },
        ]
      },
      {
        id: 'e2', domain: DOMAINS.ENVIRONMENT,
        scenario: `כש${g('אתה יושב','את יושבת')} ללמוד בבית, מה מצב שולחן העבודה שלך?`,
        options: [
          { text: `נקי ומאורגן. נמצאים עליו רק החומרים של הנושא ש${g('אני לומד','אני לומדת')} עכשיו.`, score: 4 },
          { text: `${g('מפנה','מפנה')} מקום מספיק כדי לשים את המחברת והספר.`, score: 3 },
          { text: `השולחן עמוס בחפצים, בגדים או צלחות, אבל אני ${g('מצטופף','מצטופפת')}.`, score: 2 },
          { text: `${g('מעדיף','מעדיפה')} ללמוד על המיטה או הספה כי השולחן לא פנוי.`, score: 1 },
        ]
      },
      {
        id: 'e3', domain: DOMAINS.ENVIRONMENT,
        scenario: `מה קורה כש${g('אתה צריך','את צריכה')} למצוא דף עבודה או מחברת ספציפית בילקוט?`,
        options: [
          { text: `${g('מוצא','מוצאת')} מיד תוך שניות, לכל מקצוע יש חוצץ או תא קבוע.`, score: 4 },
          { text: `${g('מוצא','מוצאת')} די במהירות תוך חיפוש קצר בתא המרכזי.`, score: 3 },
          { text: `${g('נאלץ','נאלצת')} לחפש בין מגוון דפים מקומטים בתחתית התיק.`, score: 2 },
          { text: `לרוב ${g('מגלה','מגלה')} שהדף נשאר בבית או הלך לאיבוד.`, score: 1 },
        ]
      },
      {
        id: 'e4', domain: DOMAINS.ENVIRONMENT,
        scenario: `כש${g('אתה מסיים','את מסיימת')} להשתמש בחפץ (כמו ציוד כתיבה, בגד ספורט, או מטען):`,
        options: [
          { text: `${g('מחזיר','מחזירה')} אותו באופן מיידי למקום הקבוע שלו.`, score: 4 },
          { text: `${g('מניח','מניחה')} אותו בסביבה הקרובה ו${g('אוסף','אוספת')} בסוף היום.`, score: 3 },
          { text: `${g('מציב','מציבה')} אותו איפשהו בחדר, ו${g('אוסף','אוספת')} רק כשצריך לסדר.`, score: 2 },
          { text: `${g('משאיר','משאירה')} אותו איפה שנפל, ו${g('מחפש','מחפשת')} אותו מחדש כש${g('אני צריך','אני צריכה')} אותו.`, score: 1 },
        ]
      },
      {
        id: 'e5', domain: DOMAINS.ENVIRONMENT,
        scenario: 'איך מנוהלים המגירות והמדפים הלימודיים שלך בחדר?',
        options: [
          { text: 'מסודרים לפי נושאים ומקצועות, קל לגשת לכל דבר.', score: 4 },
          { text: `יש סדר כללי, מדי פעם אני ${g('מרענן','מרעננת')} ו${g('מסדר','מסדרת')}.`, score: 3 },
          { text: `בלאגן קל, אבל אני פחות או יותר ${g('יודע','יודעת')} איפה כל דבר נמצא.`, score: 2 },
          { text: 'ערימות לא ממוינות, קשה למצוא ציוד ישן יותר.', score: 1 },
        ]
      },
      {
        id: 'e6', domain: DOMAINS.ENVIRONMENT,
        scenario: 'לקראת יום מיוחד (כמו טיול שנתי או יום ספורט):',
        options: [
          { text: `${g('מכין','מכינה')} את כל הציוד הנדרש כבר בערב שלפני לפי רשימה.`, score: 4 },
          { text: `${g('מכין','מכינה')} חלק בערב ואת היתר ${g('מביא','מביאה')} בבוקר.`, score: 3 },
          { text: `${g('נזכר','נזכרת')} במה שצריך רק בבוקר תוך כדי יציאה.`, score: 2 },
          { text: `בדרך כלל ${g('שכחתי','שכחתי')} פריט מרכזי או ציוד הכרחי.`, score: 1 },
        ]
      },

      // Digital
      {
        id: 'd1', domain: DOMAINS.DIGITAL,
        scenario: 'איך שמורים הקבצים ועבודות הבית במחשב או בטלפון שלך?',
        options: [
          { text: 'בתיקייה ראשית מסודרת לפי שנות לימוד ומקצועות.', score: 4 },
          { text: 'בתיקייה אחת כללית של "בית ספר".', score: 3 },
          { text: 'מפוזרים בתיקיית ההורדות (Downloads) או על שולחן העבודה.', score: 2 },
          { text: `אני לא ${g('יודע','יודעת')} איפה הקבצים נשמרים, ו${g('מחפש','מחפשת')} דרך החיפוש המהיר.`, score: 1 },
        ]
      },
      {
        id: 'd2', domain: DOMAINS.DIGITAL,
        scenario: `כש${g('אתה שומר','את שומרת')} מסמך או עבודה חדשה, איזה שם ${g('אתה נותן','את נותנת')} לקובץ?`,
        options: [
          { text: 'שם ברור ומפורט (לדוגמה: "היסטוריה_עבודה1_יוסי").', score: 4 },
          { text: 'שם קצר המזהה את הנושא (לדוגמה: "היסטוריה1").', score: 3 },
          { text: 'משאיר את השם האוטומטי שהמחשב נותן (לדוגמה: "Document1").', score: 2 },
          { text: `${g('לוחץ','לוחצת')} על מקשים אקראיים רק כדי לשמור (לדוגמה: "asdfgh").`, score: 1 },
        ]
      },
      {
        id: 'd3', domain: DOMAINS.DIGITAL,
        scenario: 'מה קורה כשמורה שולח בקבוצת הווצאפ או במייל דף עבודה או חומר למבחן?',
        options: [
          { text: `${g('שומר','שומרת')} מיד בתיקייה המתאימה או ${g('מעביר','מעבירה')} לענן.`, score: 4 },
          { text: `${g('פותח','פותחת')} ${g('וקורא','וקוראת')}, ו${g('שומר','שומרת')} בזיכרון הנייד במידת הצורך.`, score: 3 },
          { text: `${g('משאיר','משאירה')} בהודעות הווצאפ ו${g('מקווה','מקווה')} ש${g('אמצא','אמצא')} את זה בעת הצורך.`, score: 2 },
          { text: 'זה אובד בין מאות ההודעות בקבוצה עד שמישהו מנסח מחדש.', score: 1 },
        ]
      },
      {
        id: 'd4', domain: DOMAINS.DIGITAL,
        scenario: 'איך נראה שולחן העבודה (Desktop) במחשב או במסך הבית בנייד?',
        options: [
          { text: 'מסודר, רק אייקונים ותקיות חיוניות בלבד.', score: 4 },
          { text: `יש די הרבה אייקונים, אבל אני ${g('שומר','שומרת')} על אזורים פנויים.`, score: 3 },
          { text: 'מלא בעשרות תמונות, קבצים וקישורים מפוזרים.', score: 2 },
          { text: 'עמוס לחלוטין עד שלא רואים את רקע המסך.', score: 1 },
        ]
      },
      {
        id: 'd5', domain: DOMAINS.DIGITAL,
        scenario: `עד כמה ${g('אתה מגבה','את מגבה')} עבודות ופרויקטים חשובים?`,
        options: [
          { text: `${g('עובד','עובדת')} מראש בענן (Google Drive/OneDrive) עם גיבוי אוטומטי.`, score: 4 },
          { text: `${g('שולח','שולחת')} לעצמי עותק במייל או בווצאפ מדי כמה ימים.`, score: 3 },
          { text: `${g('נזכר','נזכרת')} לגבות רק כשיש תקלה או כשהעבודה כמעט מוכנה.`, score: 2 },
          { text: `לא ${g('מגבה','מגבה')} בכלל, ${g('מסתמך','מסתמכת')} על זה שהמכשיר יפעל תמיד.`, score: 1 },
        ]
      },
      {
        id: 'd6', domain: DOMAINS.DIGITAL,
        scenario: 'מחיקת קבצים מיותרים, דיווחים ישנים ותמונות מיותרות:',
        options: [
          { text: `${g('מנקה','מנקה')} באופן שוטף ומסודר אחת לכמה שבועות.`, score: 4 },
          { text: `${g('מנקה','מנקה')} מדי פעם כשהאחסון מתחיל להתמלא.`, score: 3 },
          { text: `${g('מנקה','מנקה')} רק כשיש הודעה שהזיכרון מלא לחלוטין.`, score: 2 },
          { text: `לעולם לא ${g('מוחק','מוחקת')} קבצים, ${g('צובר','צוברת')} הכל במכשיר.`, score: 1 },
        ]
      },

      // Time & Tasks
      {
        id: 't1', domain: DOMAINS.TIME,
        scenario: `מתי ${g('אתה מתחיל','את מתחילה')} ללמוד למבחן גדול או לבוחן חשוב?`,
        options: [
          { text: 'כמה ימים מראש, לפי תוכנית חלוקה יומית מסודרת.', score: 4 },
          { text: `יומיים מראש, ${g('עובר','עוברת')} על החומר באופן מרוכז.`, score: 3 },
          { text: 'אחה"צ אחד לפני המבחן, בלמידה אינטנסיבית.', score: 2 },
          { text: 'בליילה שלפני או בבוקר של המבחן בדרך לבית הספר.', score: 1 },
        ]
      },
      {
        id: 't2', domain: DOMAINS.TIME,
        scenario: 'מהי רמת היכולת שלך להגיע בזמן בבוקר לבית הספר?',

      const [baseUrlInput, setBaseUrlInput] = useState('');

      // ---- טעינת נתונים שמורים מ-localStorage ----
      useEffect(() => {
        try {
          const savedCodes = localStorage.getItem('mirror_class_codes');
          if (savedCodes) setClassCodesList(JSON.parse(savedCodes));
          else setClassCodesList([{ code: 'ORANIT8', createdAt: new Date().toISOString().split('T')[0], active: true }]);

          const savedBase = localStorage.getItem('mirror_base_url');
          if (savedBase) setBaseUrlInput(savedBase);
        } catch (e) {
          setClassCodesList([{ code: 'ORANIT8', createdAt: new Date().toISOString().split('T')[0], active: true }]);
        }
      }, []);

      const getBaseUrl = () => {
        if (baseUrlInput && baseUrlInput.trim()) {
          let u = baseUrlInput.trim();
          if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
          return u.replace(/\?.*$/, '').replace(/#.*$/, '');
        }
        if (typeof window !== 'undefined') {
          const href = window.location.href.split('?')[0].split('#')[0];
          if (href && !href.startsWith('about:') && !href.startsWith('blob:') && href.startsWith('http')) {
            return href;
          }
        }
        return '';

            setCopySuccess(true); setTimeout(() => setCopySuccess(false), 2500);
          }).catch(() => fallbackCopy(fullLink));
        } else { fallbackCopy(fullLink); }
      };

      const generateRandomCode = () => {

          domainStatus[domain] = { avg, statusObj };

          if (avg < minAvg) { minAvg = avg; lowest = domain; }
          if (avg > maxAvg) { maxAvg = avg; highest = domain; }
        });

                    <input type="text" value={baseUrlInput} onChange={(e) => setBaseUrlInput(e.target.value)} placeholder="ronithantis.github.io/mirror"
                      className="flex-1 p-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 font-mono text-sm text-left focus:ring-2 focus:ring-slate-900 focus:outline-none" dir="ltr" />
                    <button onClick={saveBaseUrl} className="px-5 py-3 bg-slate-100 text-slate-800 text-xs font-semibold rounded-xl hover:bg-slate-200 border border-slate-300 transition-colors">שמירת כתובת</button>
                  </div>
                </div>

                {/* יצירת קוד */}
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                  <h3 className="text-lg font-bold text-slate-900">יצירת קוד כיתה חדש</h3>
                  {codeError && <div className="p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-xs font-medium">{codeError}</div>}
                  <div className="flex flex-col sm:flex-row gap-3">
                    <input type="text" value={newCodeInput} onChange={(e) => setNewCodeInput(e.target.value.toUpperCase())} placeholder="קוד אישי (או השאירו ריק לקוד אקראי)"
                      className="flex-1 p-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 font-mono tracking-wider text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none uppercase" />
                    <button onClick={handleCreateCode} className="px-6 py-3 bg-slate-900 text-white text-xs font-semibold rounded-xl hover:bg-slate-800 transition-colors shadow-sm">צור קוד והצג QR 📱</button>
                  </div>
                </div>

                {/* רשימת קודים */}
                {classCodesList.length > 0 && (
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
                    <h3 className="text-base font-bold text-slate-900 border-b border-slate-100 pb-3">קודי הכיתה שלך</h3>
                    <div className="space-y-2.5">
                      {classCodesList.map((c) => (
                        <div key={c.code} className="flex flex-wrap items-center justify-between gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                          <div>
                            <span className="text-2xl font-mono font-bold tracking-wider text-slate-900">{c.code}</span>
                            <span className="text-[11px] text-slate-400 block">נוצר: {c.createdAt}</span>
                          </div>
                          <div className="flex gap-2 flex-wrap">
                            <button onClick={() => setQrModalCode(c.code)} className="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-xl transition-colors shadow-sm">הצג QR 📱</button>
                            <button onClick={() => handleCopyLink(c.code)} className="px-3 py-2.5 bg-white text-slate-700 hover:bg-slate-100 text-xs font-semibold rounded-xl border border-slate-300 transition-colors">{copySuccess ? '✓ הועתק!' : '📋 קישור'}</button>
                            <button onClick={() => deleteCode(c.code)} className="px-3 py-2.5 bg-white text-slate-400 hover:text-red-600 hover:bg-red-50 text-xs font-semibold rounded-xl border border-slate-200 transition-colors">מחיקה</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* ===== מודל QR ===== */}
          {qrModalCode && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 sm:p-8 text-center space-y-5 shadow-2xl border border-slate-200 overflow-y-auto max-h-[90vh]">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">סריקה לכיתה</span>
                  <button onClick={() => setQrModalCode(null)} className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold flex items-center justify-center text-sm">✕</button>
                </div>

                {baseUrlReady() ? (
                  <>
                    <div className="space-y-1">
                      <h3 className="text-xl sm:text-2xl font-bold text-slate-900">סורקים ומגיעים ישר לאבחון</h3>
                      <p className="text-xs sm:text-sm text-slate-500">כוונו את מצלמת הטלפון לברקוד כדי להיכנס לשאלון</p>
                    </div>
                    <div className="p-4 bg-white border-2 border-slate-900 rounded-2xl inline-block shadow-inner">
                      <img src={`https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(`${getBaseUrl()}?code=${qrModalCode}`)}`}
                        alt={`QR ${qrModalCode}`} className="w-48 h-48 sm:w-56 sm:h-56 mx-auto rounded-lg" />
                    </div>
                  </>
                ) : (
                  <div className="p-5 bg-amber-50 border border-amber-200 rounded-xl text-right space-y-2">
                    <p className="text-sm font-bold text-amber-900">עוד לא הוזנה כתובת אתר</p>
                    <p className="text-xs text-amber-800 leading-relaxed">כדי שה-QR יוביל לאבחון, הזינו קודם את כתובת האתר בשדה "כתובת האתר לסריקה". בינתיים תוכלו למסור לתלמידים את הקוד הידני למטה.</p>
                  </div>
                )}

                <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1">
                  <span className="text-xs text-slate-400 font-medium">קוד הכיתה להזנה ידנית:</span>
                  <div className="text-3xl font-mono font-bold tracking-widest text-slate-900">{qrModalCode}</div>
                </div>

                <div className="space-y-2 text-right pt-1">
                  <button onClick={() => handleCopyLink(qrModalCode)} className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-900 font-semibold rounded-lg text-xs transition-colors">{copySuccess ? '✓ הקישור הועתק!' : '📋 העתקת קישור לשיתוף בוואטסאפ / קלאסרום'}</button>
                  <button onClick={() => { setClassCode(qrModalCode); setQrModalCode(null); setCurrentScreen('entry'); }} className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-lg text-xs transition-colors">🧪 בדיקת כניסת תלמיד לקוד זה</button>
                </div>
                <button onClick={() => setQrModalCode(null)} className="w-full py-2.5 bg-white text-slate-700 font-semibold rounded-xl border border-slate-300 hover:bg-slate-50 transition-colors text-sm">סגירה</button>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-200 bg-white py-6 mt-12 no-print">
            <div className="max-w-4xl mx-auto px-6 text-center text-xs text-slate-400 space-y-1">
              <p>מראת ההתארגנות • מערכת אבחון אישית למיומנויות סדר וארגון</p>
              <p>לתלמידי חטיבת ביניים (כיתות ו'–ח') • ללא ציון וללא שיפוט</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
